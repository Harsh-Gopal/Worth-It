<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1200 360"
  role="img"
  aria-labelledby="worthItTitle worthItDesc"
>
  <title id="worthItTitle">Worth-It</title>
  <desc id="worthItDesc">
    Worth-It logo with green downward marks, red upward mark, mirrored black accents, and the tagline Find the price worth buying.
  </desc>

  <!-- Brand mark -->
  <g transform="translate(40 35)">
    
    <!-- Left mirrored accent: \ -->
    <path
      d="M 35 35 L 78 102"
      fill="none"
      stroke="currentColor"
      stroke-width="20"
      stroke-linecap="round"
    />

    <!-- Right mirrored accent: / -->
    <path
      d="M 315 102 L 358 35"
      fill="none"
      stroke="currentColor"
      stroke-width="20"
      stroke-linecap="round"
    />

    <!-- First green V -->
    <path
      d="M 78 120 L 125 190 L 172 120"
      fill="none"
      stroke="#22C77A"
      stroke-width="26"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Red upward caret -->
    <path
      d="M 135 92 L 175 40 L 215 92"
      fill="none"
      stroke="#EF4444"
      stroke-width="24"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Second green V -->
    <path
      d="M 178 120 L 225 190 L 272 120"
      fill="none"
      stroke="#22C77A"
      stroke-width="26"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Wordmark -->
    <text
      x="300"
      y="175"
      font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
      font-size="112"
      font-weight="700"
      letter-spacing="-5"
      fill="currentColor"
    >
      orth
    </text>

    <!-- Hyphen -->
    <text
      x="620"
      y="175"
      font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
      font-size="105"
      font-weight="700"
      fill="currentColor"
    >
      -
    </text>

    <!-- It -->
    <text
      x="690"
      y="175"
      font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
      font-size="112"
      font-weight="700"
      letter-spacing="-5"
      fill="currentColor"
    >
      It
    </text>

    <!-- Tagline -->
    <text
      x="350"
      y="250"
      font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
      font-size="28"
      font-weight="400"
      letter-spacing="8"
      fill="currentColor"
      opacity="0.65"
    >
      Find the price worth buying.
    </text>

  </g>
</svg>
